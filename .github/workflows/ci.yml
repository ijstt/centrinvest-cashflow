name: CI / Verification Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-verification:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: cashflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:ci-test-only@localhost:5432/cashflow_test
      GEMINI_API_KEYS: ''
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend/.[dev]"
      - name: Run Backend Acceptance and Regression Tests
        run: |
          PYTHONPATH=backend pytest backend/tests/

  frontend-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          cd frontend && npm ci
      - name: Verify Contract Schema Sync
        run: |
          cd frontend && npm run contracts:check
      - name: Run Frontend Unit Tests
        run: |
          cd frontend && npm test
      - name: Verify TypeScript & Build
        run: |
          cd frontend && npm run build
